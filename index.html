<style>
:root{--bg:#07111f;--card:#101f35;--line:#294568;--text:#edf6ff;--muted:#a9bfda;--cyan:#49e5da;--purple:#9e7cff;--red:#ff6684;--amber:#ffcb66}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#192e54,transparent 35%),var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button{font:inherit;color:inherit;cursor:pointer}.shell{max-width:1080px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px}.brand{font-weight:800;letter-spacing:.08em}.brand b{color:var(--cyan)}.quiet{background:none;border:1px solid var(--line);border-radius:99px;padding:8px 12px}.hero{text-align:center;padding:38px 12px 20px}.mascot{font-size:56px;filter:drop-shadow(0 0 15px #49e5da)}h1{font-size:clamp(2rem,6vw,3.8rem);margin:4px 0}.lead{color:var(--muted);max-width:680px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:28px}.module,.panel{background:linear-gradient(145deg,#142641,#0d192d);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 40px #0004}.module{padding:22px;text-align:left;transition:.2s transform,.2s border}.module:hover,.module:focus-visible{transform:translateY(-3px);border-color:var(--cyan)}.num{color:var(--cyan);font-weight:700}.module h2{margin:8px 0}.module p{color:var(--muted);min-height:48px}.arrow{color:var(--cyan);font-weight:bold}.view{display:none}.view.active{display:block}.game-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin:22px 0}.back,.primary,.answer,.action{border:1px solid var(--cyan);background:#102c45;border-radius:10px;padding:10px 15px}.primary{background:var(--cyan);color:#062033;font-weight:800}.intro,.result{max-width:760px;margin:36px auto;padding:28px}.rules{background:#071625;border-left:3px solid var(--cyan);padding:14px;margin:18px 0}.progress{height:10px;background:#071625;border-radius:8px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));width:0%;transition:.3s}.hud{display:flex;justify-content:space-between;color:var(--muted);font-weight:700}.arena{height:410px;position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,#0b1a2d 0 32%,#19304f 32.4% 33.2%);border:1px solid var(--line);border-radius:18px}.ship,.snake{position:absolute;font-size:34px;transition:left .15s,bottom .15s}.ship{bottom:20px;left:calc(50% - 17px)}.fall{position:absolute;font-size:28px;animation:fall 3.4s linear forwards}.breaker{height:410px;position:relative;overflow:hidden;background:linear-gradient(#0b1b31,#07111f);border:1px solid var(--line);border-radius:18px}.brickwall{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:20px}.gamebrick{height:28px;border-radius:7px;background:linear-gradient(135deg,var(--purple),var(--cyan));box-shadow:0 0 12px #49e5da66}.ball{position:absolute;font-size:22px;z-index:2}.paddle{position:absolute;bottom:18px;width:110px;height:16px;border-radius:10px;background:var(--cyan);box-shadow:0 0 15px #49e5da}.dino-run{height:300px;position:relative;overflow:hidden;background:linear-gradient(#11294a 0 74%,#4b6580 74% 76%,#0b192b 76%);border:1px solid var(--line);border-radius:18px}.dino{position:absolute;bottom:56px;left:16%;font-size:48px;transition:bottom .15s,transform .15s}.dino.jump{bottom:155px}.dino.duck{transform:scaleY(.58);transform-origin:bottom}.hazard{position:absolute;left:100%;bottom:56px;font-size:35px;animation:hazard 2.4s linear forwards}.hazard.air{bottom:120px}@keyframes hazard{to{transform:translateX(-125vw)}}@keyframes fall{to{transform:translateY(455px)}}.snake{font-size:30px}.brick{position:absolute;font-size:25px}.controls{display:flex;gap:10px;justify-content:center;margin:14px}.controls button{min-width:58px;font-size:20px}.feed{max-width:760px;margin:auto}.post{padding:18px;margin:14px 0}.meta{color:var(--cyan);font-size:.9em}.post p{margin:9px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.action{background:#12233a;border-color:var(--line)}.action:hover{border-color:var(--cyan)}.scene{min-height:260px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:20px}.risk{background:#0a1728;border:1px solid var(--line);border-radius:12px;padding:15px;text-align:left}.risk:hover,.risk:focus{border-color:var(--amber)}.risk small{display:block;color:var(--muted)}.modal{position:fixed;inset:0;background:#020812cc;display:grid;place-items:center;padding:16px;z-index:3}.modal[hidden]{display:none}.question{max-width:700px;width:100%;padding:25px}.answers{display:grid;gap:10px}.answer{text-align:left;background:#0b192a;border-color:var(--line)}.answer:hover{border-color:var(--cyan)}.feedback{margin-top:15px;padding:14px;border-radius:10px;background:#10283b}.good{border-left:4px solid var(--cyan)}.bad{border-left:4px solid var(--red)}.hidden{display:none!important}.tiny{color:var(--muted);font-size:.9rem}@media(max-width:650px){.shell{padding:15px}.grid{grid-template-columns:1fr}.arena{height:360px}.scene{grid-template-columns:1fr}.top{align-items:flex-start}.module p{min-height:0}}
</style></head>
<body><main class="shell"><header class="top"><div class="brand"><b>MENTO</b> / DÉFIS CYBER</div><button class="quiet" id="quiet">🔇 Mode silencieux : actif</button></header>
<section id="home" class="view active"><div class="hero"><div class="mascot" aria-hidden="true">🤖</div><h1>Prêt·e à déjouer les pièges ?</h1><p class="lead">Je suis Mento, ton copilote cyber. Choisis une mission : 10 défis concrets, des retours immédiats et aucun compte à créer.</p></div><div class="grid" id="moduleGrid"></div></section>
<section id="game" class="view"><div class="game-head"><button class="back" id="homeBtn">← Accueil</button><div><strong id="gameTitle"></strong><div class="tiny" id="gameHint"></div></div><div class="tiny">🔇 Sans son</div></div><div class="hud"><span id="counter">Questions : 0 / 10</span><span id="extra"></span></div><div class="progress"><i id="bar"></i></div><div id="stage"></div></section></main><div id="modal" class="modal" hidden></div>
<script>
/* Banques modifiables : chaque entrée comporte exactement 3 réponses, la meilleure a ok:true. */
const qs=(items)=>items.map(([q,a,b,c,e])=>({q,answers:[{t:a},{t:b},{t:c,ok:true}],e}));
const BANKS={
password:qs([
['Pour le compte de l’association, quel mot de passe choisir ?','asso2026','Une phrase connue avec un chiffre','Une phrase de passe longue, unique et générée ou mémorisable','Un secret long et unique limite les dégâts d’une fuite.'],['Un site annonce une fuite de votre compte. Que faire ?','Attendre de voir','Changer seulement le mot de passe du site','Changer immédiatement le mot de passe concerné, vérifier les réutilisations et activer la MFA','Agir vite protège aussi les comptes ayant eu un secret similaire.'],['Un collègue demande votre mot de passe pour finir une tâche.','Le lui envoyer par messagerie','Le dicter si c’est urgent','Refuser et utiliser le partage de droits ou un accès délégué','Un mot de passe est personnel : on partage l’accès, pas le secret.'],['À quoi sert un gestionnaire de mots de passe ?','À publier les mots de passe','À retenir un seul mot de passe faible','À générer et conserver des secrets uniques dans un coffre protégé','Il évite la réutilisation et facilite les mots de passe longs.'],['La MFA protège surtout quand…','Le Wi-Fi est lent','Le mot de passe a fuité','On utilise une adresse e-mail','Un second facteur bloque souvent la connexion même si le secret est connu.'],['Sur un ordinateur partagé, après une pause :','Laisser la session ouverte','Fermer seulement le navigateur','Verrouiller la session avant de s’éloigner','Le verrouillage empêche une utilisation immédiate par un tiers.'],['Où noter un code de récupération ?','Dans un commentaire public','Dans un fichier sur le bureau','Dans le coffre de mots de passe ou un lieu physique sécurisé','Les codes de récupération donnent accès au compte.'],['Pour les comptes professionnel et personnel :','Utiliser le même mot de passe','Changer un caractère selon le site','Utiliser des mots de passe uniques, notamment pour le professionnel','Une fuite d’un service ne doit pas ouvrir les autres.'],['Une alerte MFA inattendue apparaît.','L’accepter pour la faire disparaître','L’ignorer sans suite','La refuser et signaler une possible tentative de connexion','Elle peut indiquer qu’un mot de passe a été compromis.'],['Un mot de passe robuste est…','Le prénom avec 123','Un mot court très compliqué','Long, unique et idéalement généré par un gestionnaire','La longueur et l’unicité sont les protections principales.'],
...Array.from({length:20},(_,i)=>['Situation de compte n°'+(i+11)+' : quelle règle appliquer ?','Réutiliser un ancien secret','Faire une petite variante du secret','Utiliser un secret long, unique et activer la MFA lorsque proposée','Chaque compte mérite un secret distinct et une protection renforcée.'])]),
phishing:qs([
['Un e-mail demande un paiement urgent au nom d’un responsable.','Payer immédiatement','Répondre au même e-mail','Vérifier la demande via un numéro ou canal connu avant toute action','Un autre canal évite de répondre à un imposteur.'],['Un lien affiche “portail-association.exemple” mais mène ailleurs.','Cliquer si le texte semble familier','Le transférer à un collègue','Ne pas cliquer, ouvrir le portail habituel ou signaler','Le texte visible peut masquer une autre destination.'],['Une pièce jointe inattendue arrive d’un contact connu.','L’ouvrir pour vérifier','Répondre en demandant si c’est bien lui','Vérifier par un autre canal avant de l’ouvrir','Le compte d’un contact peut avoir été compromis.'],['Après avoir cliqué sur un lien douteux :','Ne rien dire','Fermer simplement la page','Couper l’action, signaler rapidement et suivre la procédure de sécurité','Un signalement rapide permet de limiter l’impact.'],['Un SMS invite à scanner un QR code pour “débloquer” un compte.','Le scanner','Demander le code à un collègue','Passer par le site ou l’application officielle, sans scanner le code','Un QR code peut cacher une destination malveillante.'],['Un expéditeur ressemble à un service interne mais l’adresse est inhabituelle.','Se fier au nom affiché','Répondre avec les informations demandées','Contrôler l’adresse complète et signaler en cas de doute','Le nom affiché n’est pas une preuve d’identité.'],['Un message impose une action “dans 10 minutes”.','Obéir sous la pression','Attendre sans analyser','Prendre le temps de vérifier la demande et ses indices','L’urgence artificielle est un levier classique.'],['Un appel demande votre code MFA.','Le donner au téléphone','Le donner après avoir rappelé le numéro','Ne jamais le communiquer et signaler la demande','Un code MFA ne doit jamais être partagé.'],['Une facture reçue ne correspond à aucune commande.','La payer pour éviter une relance','Ouvrir la pièce jointe pour confirmer','Vérifier auprès du fournisseur via les coordonnées connues','Ne suivez pas les coordonnées fournies par le message suspect.'],['Un message demande votre mot de passe “pour maintenance”.','Le transmettre','Le changer puis le transmettre','Refuser et contacter le support via le canal officiel','Le support légitime ne demande pas votre mot de passe.'],
...Array.from({length:20},(_,i)=>['Alerte de messagerie n°'+(i+11)+' : une demande inhabituelle arrive.','Faire confiance au message','Répondre pour demander confirmation','Vérifier par un canal indépendant et signaler si besoin','La vérification indépendante neutralise l’usurpation.'])]),
social:qs([
['Une demande de connexion provient d’un profil récent sans contacts communs.','Accepter pour développer le réseau','Envoyer vos informations en message privé','Vérifier l’identité hors plateforme ou ignorer/signaler','Les faux profils collectent souvent des informations.'],['Un concours promet un cadeau contre vos identifiants.','Participer vite','Partager seulement votre e-mail','Ne pas participer et signaler le contenu suspect','Un concours légitime ne demande pas vos identifiants.'],['Avant de cliquer sur une URL raccourcie :','Cliquer pour voir','Demander à un inconnu ce que c’est','Vérifier la destination ou passer par le site officiel','Une URL raccourcie peut cacher le vrai domaine.'],['Une application demande tous vos contacts pour un jeu.','Accepter','Accepter puis supprimer le jeu','Refuser les permissions inutiles et choisir une source fiable','Les permissions doivent être nécessaires au service.'],['Publier son déplacement professionnel en direct :','C’est sans risque','Masquer seulement la ville','Éviter le temps réel et limiter les détails exploitables','Ces informations facilitent l’ingénierie sociale.'],['Une publicité propose un logiciel “gratuit” hors site officiel.','Télécharger','Chercher un autre lien promotionnel','Utiliser uniquement la source officielle ou validée','Les sources non officielles peuvent diffuser des logiciels malveillants.'],['Votre profil est public par défaut.','Ne rien modifier','Cacher seulement votre photo','Revoir les paramètres et limiter la visibilité aux besoins','La confidentialité réduit l’exposition des informations.'],['Un faux compte reprend la photo d’un bénévole.','Lui écrire publiquement vos données','L’ignorer sans rien faire','Signaler l’usurpation et prévenir la personne concernée','Le signalement aide la plateforme à agir.'],['Pour une inscription personnelle :','Utiliser l’adresse professionnelle','Utiliser l’adresse pro si le site est connu','Préférer une adresse personnelle lorsque l’usage n’est pas professionnel','Séparer les usages limite les risques et sollicitations.'],['Une publication affiche des fautes, un gain énorme et un délai court.','Partager','Commenter pour demander une preuve','Ne pas interagir et signaler comme arnaque potentielle','Ces indices combinés sont typiques d’une escroquerie.'],
...Array.from({length:20},(_,i)=>['Publication n°'+(i+11)+' : que faire face à un lien ou compte inhabituel ?','Partager sans vérifier','Regarder seulement la photo','Vérifier le compte et l’adresse réelle avant toute interaction','L’analyse des indices permet d’éviter les pièges.'])]),
nomad:qs([
['Au café, quel réseau utiliser pour un dossier sensible ?','Le premier Wi-Fi ouvert','N’importe quel Wi-Fi avec un mot de passe','Le partage mobile ou la solution d’accès sécurisée prévue','Un réseau ouvert expose davantage les échanges.'],['Vous trouvez une clé USB dans le train.','La brancher pour identifier le propriétaire','La garder sans la brancher','Ne pas la brancher et la remettre au circuit prévu','Une clé inconnue peut contenir un programme malveillant.'],['Dans un train, votre écran est visible.','Continuer avec des données sensibles','Baisser un peu la luminosité','Utiliser un filtre de confidentialité ou reporter la consultation','Les regards indiscrets sont un risque réel.'],['Vous quittez votre table quelques minutes.','Laisser l’ordinateur ouvert','Fermer seulement le document','Verrouiller l’écran et emporter ou attacher le matériel','La protection physique complète le verrouillage.'],['Un réseau “Café-Invités” et “Cafe-Invites” apparaissent.','Choisir le plus fort signal','Tester les deux','Demander le nom exact au personnel avant toute connexion','Un faux point d’accès peut imiter le réseau officiel.'],['Votre téléphone professionnel est perdu.','Attendre de le retrouver','Appeler un proche','Signaler immédiatement selon la procédure de l’organisation','Un signalement rapide permet de protéger ou effacer l’appareil.'],['Un inconnu propose un port USB de recharge.','Brancher le téléphone','Brancher seulement quelques minutes','Préférer son chargeur ou une batterie externe fiable','Un port inconnu peut présenter un risque.'],['Des documents sensibles restent sur la table.','Les laisser face cachée','Les mettre sous un ordinateur','Les ranger dans un sac fermé et les transporter avec vous','La confidentialité passe aussi par les documents papier.'],['Pour accéder aux outils associatifs hors site :','Utiliser tout appareil disponible','Utiliser un appareil personnel sans précaution','Employer l’équipement et l’accès distant autorisés, à jour','Les outils validés offrent les protections attendues.'],['Dans un lieu public, un appel professionnel doit être passé.','Donner tous les détails','Parler moins fort seulement','Éviter les informations sensibles ou s’isoler','Les personnes proches peuvent entendre la conversation.'],
...Array.from({length:20},(_,i)=>['Situation nomade n°'+(i+11)+' : quelle action est la plus sûre ?','Continuer sans précaution','Faire seulement une vérification rapide','Utiliser les outils autorisés, protéger l’écran et signaler tout incident','En mobilité, sécurité réseau, physique et signalement sont complémentaires.'])])};
const modules=[['password','01','Comptes & mots de passe','Le serpent des secrets','Dirige avec les flèches ou les boutons. Mange 10 briques : chaque brique déclenche un défi.'],['phishing','02','E-mail & phishing','Route anti-pièges','Déplace le vaisseau sur 3 voies (← →). Attrape les balises ❔ et évite les menaces.'],['social','03','Internet & réseaux sociaux','Casse-briques de vigilance','Déplace la raquette (← →) et casse les briques : chacune déclenche un défi cyber.'],['nomad','04','Télétravail & nomadisme','Dino nomade','Saute ou baisse-toi selon l’obstacle (↑ / ↓ ou boutons). Chaque obstacle lance un défi.']];
let state={},timer;const $=s=>document.querySelector(s);const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function home(){clearInterval(timer);$('#game').classList.remove('active');$('#home').classList.add('active');$('#modal').hidden=true}function start(id){clearInterval(timer);state={id,questions:shuffle(BANKS[id]).slice(0,10),n:0,score:0,vigilance:0,errors:[],energy:3};$('#home').classList.remove('active');$('#game').classList.add('active');let m=modules.find(x=>x[0]==id);$('#gameTitle').textContent=m[3];$('#gameHint').textContent=m[4];renderIntro(m)}
function renderIntro(m){$('#stage').innerHTML=`<article class="panel intro"><div class="mascot">🤖</div><h2>Bonjour, je suis Mento !</h2><p>${m[4]}</p><div class="rules"><strong>Règle de la mission</strong><br>Réponds à 10 questions, une seule fois chacune. Les réponses sont mélangées et une explication s’affiche immédiatement. Une partie dure moins de 10 minutes.</div><button class="primary" id="launch">Lancer la mission</button></article>`;$('#launch').onclick=launch}
function update(){let n=state.n;$('#counter').textContent=`Questions : ${n} / 10`;$('#bar').style.width=(n*10)+'%';$('#extra').textContent=state.id==='phishing'?`Énergie : ${'⚡'.repeat(state.energy)}`:state.id==='social'?`Vigilance : ${state.vigilance}`:state.id==='nomad'?`Sécurité : ${state.vigilance}`:''}
function launch(){update();({password:snake,phishing:road,social:breaker,nomad:dino})[state.id]()}
function ask(){clearInterval(timer);let q=state.questions[state.n];$('#modal').hidden=false;$('#modal').innerHTML=`<article class="panel question"><div class="tiny">DÉFI CYBER</div><h2>${q.q}</h2><div class="answers">${shuffle(q.answers).map((a,i)=>`<button class="answer" data-i="${i}">${a.t}</button>`).join('')}</div><div id="feedback"></div></article>`;let answered=false;document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let a=shuffle([]);/* button owns text; recover from selected rendered text */let correct=q.answers.find(x=>x.ok).t===b.textContent;if(correct)state.score++;else state.errors.push(q.q);document.querySelectorAll('.answer').forEach(x=>x.disabled=true);$('#feedback').innerHTML=`<div class="feedback ${correct?'good':'bad'}"><strong>${correct?'✓ Bonne réponse !':'✕ À retenir'}</strong><br>${q.e}</div><button class="primary" id="continue">Continuer</button>`;$('#continue').onclick=()=>{state.n++;$('#modal').hidden=true;if(state.n>=10)finish();else launch()}})}
function snake(){let x=5,y=5,dx=1,dy=0,brick={x:12,y:7};$('#stage').innerHTML=`<div class="arena" id="arena"><span class="snake">🐍</span><span class="brick">🔐</span></div><div class="controls"><button data-d="up">↑</button><button data-d="left">←</button><button data-d="down">↓</button><button data-d="right">→</button></div>`;let draw=()=>{$('.snake').style.cssText=`left:${x*5}%;bottom:${y*7}%;` ;$('.brick').style.cssText=`left:${brick.x*5}%;bottom:${brick.y*7}%;`};let move=d=>{if(d==='up')dx=0,dy=1;if(d==='down')dx=0,dy=-1;if(d==='left')dx=-1,dy=0;if(d==='right')dx=1,dy=0};document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(b.dataset.d));document.onkeydown=e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();move(e.key.slice(5).toLowerCase())}};draw();timer=setInterval(()=>{x+=dx;y+=dy;if(x<0||x>19||y<0||y>12){x=5;y=5}if(x===brick.x&&y===brick.y){ask();return}draw()},260)}
function road(){let lane=1,spawn=0;$('#stage').innerHTML=`<div class="arena" id="arena"><span class="ship">🚀</span></div><div class="controls"><button id="left">←</button><button id="right">→</button></div><p class="tiny">Mento : les balises ❔ donnent un défi ; chaque menace ⚠️ touchée retire une vie.</p>`;let set=d=>{lane=Math.max(0,Math.min(2,lane+d));$('.ship').style.left=["15%","calc(50% - 17px)","78%"][lane]};$('#left').onclick=()=>set(-1);$('#right').onclick=()=>set(1);document.onkeydown=e=>{if(e.key==='ArrowLeft')set(-1);if(e.key==='ArrowRight')set(1)};timer=setInterval(()=>{let el=document.createElement('span'),q=spawn++%3===0;el.className='fall';el.textContent=q?'❔':'⚠️';el.style.left=["15%","48%","80%"][Math.floor(Math.random()*3)];$('#arena').append(el);setTimeout(()=>{if(!el.isConnected)return;let r=el.getBoundingClientRect(),ship=$('.ship').getBoundingClientRect(),hit=r.left<ship.right&&r.right>ship.left&&r.top<ship.bottom&&r.bottom>ship.top;if(hit){if(q)ask();else{state.energy=Math.max(0,state.energy-1);update()}}el.remove()},2650)},950)}
function breaker(){let paddle=42,ball={x:50,y:25,dx:1.15,dy:1.05},bricks=Array.from({length:15},(_,i)=>({x:8+(i%5)*18,y:7+Math.floor(i/5)*12,live:true}));$('#stage').innerHTML=`<div class="breaker" id="breaker"><div class="brickwall">${bricks.map((_,i)=>`<i class="gamebrick" data-brick="${i}"></i>`).join('')}</div><span class="ball">🟢</span><i class="paddle"></i></div><div class="controls"><button id="bLeft">←</button><button id="bRight">→</button></div><p class="tiny">Mento : attrape la balle et vise les briques. Chaque brique détruite pose une question.</p>`;let draw=()=>{$('.ball').style.cssText=`left:${ball.x}%;top:${ball.y}%;` ;$('.paddle').style.left=paddle+'%'};let move=d=>{paddle=Math.max(0,Math.min(78,paddle+d));draw()};$('#bLeft').onclick=()=>move(-10);$('#bRight').onclick=()=>move(10);document.onkeydown=e=>{if(e.key==='ArrowLeft')move(-8);if(e.key==='ArrowRight')move(8)};draw();timer=setInterval(()=>{ball.x+=ball.dx;ball.y+=ball.dy;if(ball.x<0||ball.x>96)ball.dx*=-1;if(ball.y<0){ball.dy=Math.abs(ball.dy)}if(ball.y>88){if(ball.x>paddle-2&&ball.x<paddle+24){ball.dy=-Math.abs(ball.dy);ball.dx+=(ball.x-(paddle+11))*.025}else{ball={x:50,y:25,dx:1.15,dy:1.05};state.errors.push('Balle non rattrapée : garder la raquette sous la balle')}}let hit=bricks.findIndex(b=>b.live&&Math.abs(ball.x-b.x)<8&&Math.abs(ball.y-b.y)<6);if(hit>=0){bricks[hit].live=false;document.querySelector(`[data-brick="${hit}"]`).style.visibility='hidden';ball.dy*=-1;ask();return}draw()},35)}
function dino(){let pose='',busy=false;$('#stage').innerHTML=`<div class="dino-run" id="dinoRun"><span class="dino">🦖</span></div><div class="controls"><button id="jump">↑ Sauter</button><button id="duck">↓ Se baisser</button></div><p class="tiny">Mento : saute au-dessus des caisses 🧳 et baisse-toi sous les drones 🛸.</p>`;let act=p=>{if(busy)return;pose=p;$('.dino').className='dino '+p;setTimeout(()=>{pose='';if($('.dino'))$('.dino').className='dino'},p==='jump'?650:550)};$('#jump').onclick=()=>act('jump');$('#duck').onclick=()=>act('duck');document.onkeydown=e=>{if(e.key==='ArrowUp'||e.key===' ')act('jump');if(e.key==='ArrowDown')act('duck')};let count=0;timer=setInterval(()=>{busy=true;let air=count++%2===1,el=document.createElement('span');el.className='hazard'+(air?' air':'');el.textContent=air?'🛸':'🧳';$('#dinoRun').append(el);setTimeout(()=>{let safe=air?pose==='duck':pose==='jump';if(!safe){state.vigilance=Math.max(0,state.vigilance-1);state.errors.push(air?'Drone non évité : se baisser sous un obstacle haut':'Caisse non évitée : sauter un obstacle au sol')}else state.vigilance++;update();el.remove();busy=false;ask()},1780)},2500)}
function finish(){clearInterval(timer);let msg=state.score>=9?'Bien joué ! Tu maîtrises les bons réflexes cyber.':state.score>=6?'Presque ! Quelques réflexes restent à consolider.':'Mento te conseille de revoir les bonnes pratiques avant de retenter ta chance.';let extra='';if(state.id==='social')extra=`<p><strong>Vigilance du casse-briques : ${state.vigilance}/10</strong></p><h3>Erreurs à retenir</h3><ul>${(state.errors.slice(0,3).length?state.errors.slice(0,3):['Aucune erreur de vigilance relevée']).map(x=>`<li>${x}</li>`).join('')}</ul><p><strong>Conseils :</strong> vérifie les profils et les URL ; limite les informations visibles ; signale les contenus suspects.</p>`;if(state.id==='nomad')extra=`<p><strong>Sécurité des environnements : ${state.vigilance}/10</strong></p><h3>Les 5 réflexes essentiels</h3><ol><li>Utiliser un accès réseau sécurisé.</li><li>Verrouiller et garder ses équipements avec soi.</li><li>Protéger écran et conversations des regards indiscrets.</li><li>Éviter les supports et ports inconnus.</li><li>Signaler vite perte, vol ou incident.</li></ol>`;$('#stage').innerHTML=`<article class="panel result"><div class="mascot">🤖</div><h2>Mission terminée : ${state.score}/10</h2><p>${msg}</p>${extra}<div class="actions"><button class="primary" id="again">Rejouer</button><button class="back" id="finishHome">Retour à l’accueil</button></div></article>`;$('#again').onclick=()=>start(state.id);$('#finishHome').onclick=home;update()}
$('#moduleGrid').innerHTML=modules.map(m=>`<button class="module" data-id="${m[0]}"><span class="num">MODULE ${m[1]}</span><h2>${m[2]}</h2><p>${m[3]}</p><span class="arrow">Lancer →</span></button>`).join('');document.querySelectorAll('.module').forEach(b=>b.onclick=()=>start(b.dataset.id));$('#homeBtn').onclick=home;$('#quiet').onclick=()=>$('#quiet').textContent='🔇 Mode silencieux : actif';
</script></body></html>
